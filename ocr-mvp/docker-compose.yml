services:
  ocr:
    build: .
    image: ocr-mvp:latest
    container_name: ocr-mvp
    # Keeps the service up (and the models warm) across crashes and reboots.
    restart: unless-stopped
    # Run as the host user so files written to the bind mounts are owned by you.
    # Set UID and GID in .env (see .env.example).
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      APP_MODULE: server:app
      HOME: /models
      PADDLE_PDX_CACHE_HOME: /models/.paddlex
      # Read from .env. The service refuses to start if GROQ_API_KEY is empty.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    ports:
      - "8000:8000"
    # Bind mounts are read-write and created on the host if missing, so you can freely
    # add, edit and delete files in these folders.
    volumes:
      - type: bind
        source: ./input
        target: /input
        bind:
          create_host_path: true
      - type: bind
        source: ./output
        target: /output
        bind:
          create_host_path: true
      - type: bind
        source: ./models
        target: /models
        bind:
          create_host_path: true
      # Mount the code so edits to server.py apply after `docker compose restart`
      # without rebuilding the image.
      - type: bind
        source: ./
        target: /app
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3

  # PostgreSQL for the bill rooms. Start it alone with: docker compose up -d db
  db:
    # Pinned to 17: PostgreSQL 18+ changed the data directory layout used below.
    image: postgres:17
    container_name: splitty-db
    restart: unless-stopped
    # Defaults work out of the box. Override them in .env if you want different values.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-splitty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitty}
      POSTGRES_DB: ${POSTGRES_DB:-splitty}
    # Bound to localhost only, so the database is not reachable from other machines.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A named volume is managed by Docker, so there are no host file permissions to fix.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Room API: turns receipts into sessions. It does not wait for OCR to start, so it comes up fast.
  backend:
    build: ../backend
    container_name: splitty-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-splitty}:${POSTGRES_PASSWORD:-splitty}@db:5432/${POSTGRES_DB:-splitty}
      OCR_URL: http://ocr:8000
    # Localhost only until auth and rate limiting exist (Phase 8).
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # Data survives `docker compose down`. Only `docker compose down -v` deletes it.
  pgdata:
